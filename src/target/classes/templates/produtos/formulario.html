<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercado Express - Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/produtos"><i class="bi bi-cart-check"></i> Mercado Express</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h4 class="mb-0 h5" th:text="${produto.id == null} ? 'Cadastrar Novo Produto' : 'Editar Produto'"></h4>
                </div>
                <div class="card-body p-4 bg-white">

                    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="POST">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-bold text-secondary">Nome do Produto *</label>
                            <input type="text" id="nome" class="form-control" th:field="*{nome}" required placeholder="Ex: Detergente Neutro">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="tipo" class="form-label fw-bold text-secondary">Tipo *</label>
                                <input type="text" id="tipo" class="form-control" th:field="*{tipo}" required placeholder="Ex: Limpeza">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label for="setor" class="form-label fw-bold text-secondary">Setor *</label>
                                <input type="text" id="setor" class="form-control" th:field="*{setor}" required placeholder="Ex: Corredor 4">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="tamanho" class="form-label fw-bold text-secondary">Tamanho / Volume</label>
                                <input type="text" id="tamanho" class="form-control" th:field="*{tamanho}" placeholder="Ex: 500ml">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label for="preco" class="form-label fw-bold text-secondary">Preço (R$) *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">R$</span>
                                    <input type="number" id="preco" step="0.01" min="0" class="form-control" th:field="*{preco}" required placeholder="0.00">
                                </div>
                            </div>
                        </div>

                        <hr class="mb-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/produtos" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-save"></i> Salvar Registro
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
